<main>
  <div class="tmp-mb-3 Subhead border-bottom-0 mb-0 tmp-mb-0">
    <h1 id="security-page-title">Security</h1>
    <div class="Subhead-actions" data-view-component="true">
      <a id="security-report-button" class="Button--primary Button--medium Button" data-view-component="true" href="/HKUDS/nanobot/security/advisories/new">
        <span id="security-report-content" class="Button-content">
          <span id="security-report-label" class="Button-label">Report a vulnerability</span>
        </span>
      </a>
    </div>
  </div>

  <div class="Box">
    <div id="security-file-name" class="Box-header">SECURITY.md</div>
    <article class="markdown-body">
      <h1 id="security-policy-title">Security Policy</h1>
      <h2 id="security-reporting-title">Reporting a Vulnerability</h2>
      <p id="security-policy-paragraph">
        If you discover a security vulnerability in nanobot, please report it privately to the repository maintainers.
      </p>
      <ul>
        <li id="security-policy-list-item">Do not open a public GitHub issue for an undisclosed vulnerability.</li>
      </ul>
    </article>
  </div>
</main>
