<!-- Minimal structure observed on threads.com feed and post replies, 2026-10-18.
     Text, accounts and URLs are replaced; opaque CSS classes/media are omitted. -->
<nav id="navigation"><a href="/search">Search Threads</a></nav>
<div role="region" aria-label="Column body">
  <div role="button" id="composer">What is new?</div>
  <div data-pagelet="threads_feed_0">
    <div data-virtualized="false">
      <div data-pressable-container="true" id="post">
        <a href="/@example"><span translate="no" id="author">example_author</span></a>
        <a href="/@example/post/sample"><time id="time">23 hours ago</time></a>
        <div role="button" id="more">More options</div>
        <div><div lang="en" id="post-body">
          <div><span dir="auto"><span id="first-paragraph">A walk through the city reveals something unexpected.</span>&nbsp;&nbsp;<div><div role="button" id="native-translate"><span>Translate</span></div></div></span></div>
          <div><span dir="auto"><span id="second-paragraph">The second paragraph keeps its own translation.</span>&nbsp;<div id="thread-counter"><span>1</span><div><span>/</span></div><span>2</span></div></span></div>
        </div></div>
        <div role="button" id="media"><img alt="Photo description" /></div>
        <div role="button" id="like">Like 168</div>
        <div role="button" id="reply-button">Reply 12</div>
      </div>
    </div>
  </div>
  <div data-pressable-container="true" id="reply">
    <a href="/@reader"><span translate="no" id="reply-author">reader_name</span></a>
    <div><div lang="ja"><div><span dir="auto"><span id="reply-text">この街を歩くのがとても楽しかったです。</span></span></div></div></div>
    <div role="button" id="reply-like">Like 1</div>
  </div>
  <div data-pressable-container="true" id="empty-card"><div role="button">Play video</div></div>
</div>
<footer id="footer">Threads Terms Privacy policy</footer>
