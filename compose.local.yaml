name: onlytranslate-local

services:
  website:
    build:
      context: .
      dockerfile: Dockerfile
    image: onlytranslate-website-local:latest
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./deploy/Caddyfile.local:/etc/caddy/Caddyfile:ro
      - uninstall_feedback_local:/var/log/caddy

volumes:
  uninstall_feedback_local:
