<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=440, initial-scale=1" />
  <title>OnlyTranslate Small Promotional Tile</title>
  <style>
    :root {
      font-family: Inter, "Segoe UI", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
      color: #fff;
      background: #1762d9;
      font-synthesis: none;
      text-rendering: geometricPrecision;
      -webkit-font-smoothing: antialiased;
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; width: 440px; height: 280px; overflow: hidden; }

    .tile {
      position: relative;
      width: 440px;
      height: 280px;
      overflow: hidden;
      isolation: isolate;
      background:
        radial-gradient(circle at 68% 22%, rgba(110, 231, 255, .42), transparent 32%),
        linear-gradient(135deg, #123bc4 0%, #1f7bea 56%, #18b8c8 100%);
    }

    .tile::before {
      content: "";
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(rgba(255,255,255,.12) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,.12) 1px, transparent 1px);
      background-size: 28px 28px;
      opacity: .25;
      z-index: -2;
    }

    .visual {
      position: absolute;
      top: -8px;
      right: -118px;
      width: 390px;
      height: 304px;
      object-fit: cover;
      object-position: 52% 50%;
      opacity: .98;
      filter: saturate(1.12) contrast(1.03);
      -webkit-mask-image: linear-gradient(90deg, transparent 0%, #000 18%, #000 100%);
      mask-image: linear-gradient(90deg, transparent 0%, #000 18%, #000 100%);
      z-index: -1;
    }

    .shade {
      position: absolute;
      inset: 0;
      background:
        linear-gradient(90deg, rgba(8, 29, 111, .94) 0%, rgba(16, 75, 195, .72) 47%, rgba(20, 143, 213, .10) 100%),
        radial-gradient(circle at 22% 42%, rgba(255,255,255,.18), transparent 36%);
    }

    .brand {
      position: absolute;
      top: 28px;
      left: 30px;
      display: flex;
      align-items: center;
      gap: 11px;
    }

    .brand img {
      width: 44px;
      height: 44px;
      border-radius: 13px;
      box-shadow: 0 12px 28px rgba(3, 17, 68, .30);
    }

    .brand strong {
      display: block;
      font-size: 30px;
      line-height: .95;
      font-weight: 860;
      letter-spacing: 0;
    }

    .brand span {
      display: block;
      margin-top: 5px;
      color: rgba(255,255,255,.82);
      font-size: 12px;
      font-weight: 760;
    }

    .copy {
      position: absolute;
      left: 31px;
      top: 104px;
      width: 244px;
    }

    h1 {
      margin: 0;
      font-size: 34px;
      line-height: 1.12;
      font-weight: 880;
      letter-spacing: 0;
      text-shadow: 0 7px 24px rgba(6, 20, 78, .24);
    }

    p {
      width: 238px;
      margin: 12px 0 0;
      color: rgba(255,255,255,.84);
      font-size: 14px;
      line-height: 1.42;
      font-weight: 540;
    }

    .chips {
      position: absolute;
      left: 30px;
      bottom: 18px;
      display: flex;
      gap: 8px;
    }

    .chips span {
      display: inline-flex;
      min-width: 58px;
      height: 26px;
      align-items: center;
      justify-content: center;
      padding: 0 10px;
      border: 1px solid rgba(255,255,255,.20);
      border-radius: 999px;
      background: rgba(255,255,255,.13);
      color: rgba(255,255,255,.92);
      font-size: 11px;
      font-weight: 780;
      backdrop-filter: blur(12px);
    }
  </style>
</head>
<body>
  <main class="tile">
    <img class="visual" src="../generated/small-promo-imagegen-source.png" alt="" />
    <div class="shade" aria-hidden="true"></div>

    <div class="brand">
      <img src="../../../public/icon/512.png" alt="" />
      <div>
        <strong>只译</strong>
        <span>OnlyTranslate</span>
      </div>
    </div>

    <section class="copy">
      <h1>认真读<br />外语内容</h1>
      <p>网页、字幕、EPUB 都能双语读。</p>
    </section>

    <div class="chips" aria-hidden="true">
      <span>Web</span>
      <span>Video</span>
      <span>EPUB</span>
    </div>
  </main>
</body>
</html>
