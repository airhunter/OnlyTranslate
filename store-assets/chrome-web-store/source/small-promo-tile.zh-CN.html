<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=440, initial-scale=1" />
  <title>OnlyTranslate Small Promotional Tile</title>
  <style>
    :root {
      font-family: Inter, "Segoe UI", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
      color: #061b4f;
      background: #f7efe7;
      font-synthesis: none;
      text-rendering: geometricPrecision;
      -webkit-font-smoothing: antialiased;
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; width: 440px; height: 280px; overflow: hidden; }

    .tile {
      position: relative;
      width: 440px;
      height: 280px;
      overflow: hidden;
      isolation: isolate;
      background:
        radial-gradient(circle at 23% 16%, rgba(255,255,255,.78), transparent 35%),
        linear-gradient(135deg, #fbf5ef 0%, #f4e9df 100%);
    }

    .tile::before {
      content: "";
      position: absolute;
      inset: 0;
      z-index: -1;
      background-image: radial-gradient(rgba(15,36,78,.08) .55px, transparent .65px);
      background-size: 5px 5px;
      opacity: .27;
    }

    .brand {
      position: absolute;
      top: 17px;
      right: 19px;
      display: flex;
      align-items: baseline;
      gap: 4px;
      color: #0b1f4b;
      font-size: 8px;
      font-weight: 760;
      letter-spacing: .01em;
    }

    .brand strong { font-size: 12px; font-weight: 850; letter-spacing: -.025em; }

    .bars { position: absolute; display: flex; flex-direction: column; gap: 8px; }
    .bars i { display: block; height: 10px; }
    .bars-navy { left: 22px; top: 33px; }
    .bars-navy i { background: #061b4f; }
    .bars-navy i:nth-child(1) { width: 102px; }
    .bars-navy i:nth-child(2) { width: 86px; }
    .bars-navy i:nth-child(3) { width: 72px; }
    .bars-cyan { right: 24px; top: 153px; align-items: flex-end; }
    .bars-cyan i { background: #05aec2; }
    .bars-cyan i:nth-child(1) { width: 86px; }
    .bars-cyan i:nth-child(2) { width: 101px; }
    .bars-cyan i:nth-child(3) { width: 76px; }

    .loop {
      position: absolute;
      left: 151px;
      top: 34px;
      width: 222px;
      height: 155px;
      overflow: visible;
    }

    .loop path {
      fill: none;
      stroke: #0759d8;
      stroke-width: 9;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .loop polygon { fill: #0759d8; }

    .app-icon {
      position: absolute;
      left: 206px;
      top: 71px;
      width: 62px;
      height: 62px;
      border: 3px solid rgba(255,255,255,.92);
      border-radius: 17px;
      box-shadow: 0 10px 24px rgba(16,78,184,.21);
    }

    .copy { position: absolute; left: 25px; top: 151px; }

    h1 {
      margin: 0;
      color: #061b4f;
      font-size: 36px;
      line-height: .96;
      font-weight: 900;
      letter-spacing: -.045em;
    }

    .tagline {
      margin: 10px 0 0 1px;
      color: #0b1f4b;
      font-size: 9.5px;
      line-height: 1;
      font-weight: 850;
      letter-spacing: .11em;
    }

    .features {
      position: absolute;
      right: 18px;
      bottom: 17px;
      margin: 0;
      color: #0b1f4b;
      font-size: 8.5px;
      line-height: 1;
      font-weight: 850;
      letter-spacing: .11em;
    }
  </style>
</head>
<body>
  <main class="tile">
    <div class="brand"><span>只译</span><strong>OnlyTranslate</strong></div>
    <div class="bars bars-navy" aria-hidden="true"><i></i><i></i><i></i></div>
    <div class="bars bars-cyan" aria-hidden="true"><i></i><i></i><i></i></div>
    <svg class="loop" viewBox="0 0 222 155" aria-hidden="true">
      <path d="M24 84 C25 34 69 10 115 22 C162 34 184 74 169 112" />
      <polygon points="153,103 181,105 168,130" />
    </svg>
    <img class="app-icon" src="../../../public/icon/512.png" alt="" />
    <section class="copy">
      <h1>外语内容<br />直接双语读</h1>
      <p class="tagline">READ IN TWO LANGUAGES</p>
    </section>
    <p class="features">WEB · VIDEO · EPUB · PDF</p>
  </main>
</body>
</html>
