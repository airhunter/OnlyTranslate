<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=1400, initial-scale=1" />
  <title>OnlyTranslate Marquee Promotional Tile</title>
  <style>
    :root {
      font-family: Inter, "Segoe UI", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
      color: #061b4f;
      background: #f7efe7;
      font-synthesis: none;
      text-rendering: geometricPrecision;
      -webkit-font-smoothing: antialiased;
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; width: 1400px; height: 560px; overflow: hidden; }

    .tile {
      position: relative;
      width: 1400px;
      height: 560px;
      overflow: hidden;
      isolation: isolate;
      background:
        radial-gradient(circle at 17% 18%, rgba(255,255,255,.80), transparent 32%),
        linear-gradient(130deg, #fbf5ef 0%, #f4e9df 100%);
    }

    .tile::before {
      content: "";
      position: absolute;
      inset: 0;
      z-index: -1;
      background-image: radial-gradient(rgba(15,36,78,.075) .65px, transparent .8px);
      background-size: 6px 6px;
      opacity: .30;
    }

    .brand { position: absolute; left: 72px; top: 57px; display: flex; align-items: baseline; gap: 9px; color: #0b1f4b; font-size: 18px; font-weight: 760; letter-spacing: -.01em; }
    .brand strong { font-size: 29px; font-weight: 850; letter-spacing: -.035em; }
    .copy { position: absolute; left: 72px; top: 157px; z-index: 3; }

    h1 {
      margin: 0;
      color: #061b4f;
      font-size: 76px;
      line-height: .94;
      font-weight: 900;
      letter-spacing: -.055em;
    }

    .tagline { margin: 21px 0 0 2px; color: #0b1f4b; font-size: 25px; line-height: 1; font-weight: 850; letter-spacing: .12em; }
    .bars { position: absolute; z-index: 1; display: flex; flex-direction: column; gap: 16px; transform: rotate(5deg); }
    .bars i { display: block; height: 20px; }
    .bars-navy { left: 617px; top: 49px; }
    .bars-navy i { background: #061b4f; }
    .bars-navy i:nth-child(1) { width: 252px; }
    .bars-navy i:nth-child(2) { width: 218px; }
    .bars-navy i:nth-child(3) { width: 184px; }
    .bars-cyan { right: -15px; bottom: 63px; align-items: flex-end; }
    .bars-cyan i { background: #05aec2; }
    .bars-cyan i:nth-child(1) { width: 285px; }
    .bars-cyan i:nth-child(2) { width: 335px; }
    .bars-cyan i:nth-child(3) { width: 252px; }

    .loop { position: absolute; left: 674px; top: 45px; z-index: 2; width: 660px; height: 465px; overflow: visible; }
    .loop path { fill: none; stroke: #0759d8; stroke-width: 22; stroke-linecap: round; stroke-linejoin: round; }
    .loop polygon { fill: #0759d8; }

    .app-icon {
      position: absolute;
      left: 900px;
      top: 190px;
      z-index: 4;
      width: 132px;
      height: 132px;
      border: 6px solid rgba(255,255,255,.92);
      border-radius: 36px;
      box-shadow: 0 18px 44px rgba(16,78,184,.22);
      transform: rotate(4deg);
    }

    .features { position: absolute; left: 75px; bottom: 55px; z-index: 4; margin: 0; color: #0b1f4b; font-size: 22px; line-height: 1; font-weight: 850; letter-spacing: .12em; }
  </style>
</head>
<body>
  <main class="tile">
    <div class="brand"><span>只译</span><strong>OnlyTranslate</strong></div>
    <section class="copy">
      <h1>外语内容<br />直接双语读</h1>
      <p class="tagline">READ IN TWO LANGUAGES</p>
    </section>
    <div class="bars bars-navy" aria-hidden="true"><i></i><i></i><i></i></div>
    <div class="bars bars-cyan" aria-hidden="true"><i></i><i></i><i></i></div>
    <svg class="loop" viewBox="0 0 660 465" aria-hidden="true">
      <path d="M54 256 C54 111 179 39 320 70 C461 102 531 221 490 348" />
      <polygon points="450,326 520,333 487,397" />
    </svg>
    <img class="app-icon" src="../../../public/icon/512.png" alt="" />
    <p class="features">WEB · VIDEO · EPUB · PDF</p>
  </main>
</body>
</html>
