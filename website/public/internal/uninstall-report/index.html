<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow, noarchive">
  <title>卸载反馈统计 | 只译</title>
  <style>
    :root {
      color-scheme: light;
      --blue: #255fdf;
      --blue-deep: #143d9f;
      --ink: #15213a;
      --muted: #66748e;
      --line: rgba(31, 71, 143, 0.14);
      --paper: #fff;
      --soft: #f4f7fc;
      --success: #168565;
      font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", sans-serif;
    }

    * { box-sizing: border-box; }

    body {
      min-width: 320px;
      margin: 0;
      color: var(--ink);
      background:
        radial-gradient(circle at 78% 0, rgba(69, 201, 216, 0.13), transparent 30rem),
        linear-gradient(180deg, #f8fbff, #f5f7fb 44rem);
    }

    button, select { font: inherit; }

    .shell {
      width: min(1120px, calc(100% - 40px));
      margin: 0 auto;
      padding: 54px 0 80px;
    }

    .header {
      display: flex;
      gap: 24px;
      align-items: flex-end;
      justify-content: space-between;
      margin-bottom: 30px;
    }

    .eyebrow {
      margin: 0 0 8px;
      color: var(--blue);
      font-size: 12px;
      font-weight: 800;
      letter-spacing: .14em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-size: clamp(30px, 5vw, 44px);
      letter-spacing: -.04em;
      line-height: 1.12;
    }

    .subtitle {
      margin: 12px 0 0;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.6;
    }

    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 9px;
      justify-content: flex-end;
    }

    .control, .button {
      min-height: 42px;
      padding: 0 14px;
      border: 1px solid var(--line);
      border-radius: 11px;
      background: rgba(255, 255, 255, .9);
    }

    .button {
      color: var(--blue-deep);
      font-weight: 720;
      cursor: pointer;
    }

    .button-primary {
      color: #fff;
      border-color: transparent;
      background: linear-gradient(135deg, #2d6ff0, #174bc5);
      box-shadow: 0 10px 26px rgba(37, 95, 223, .2);
    }

    .status {
      min-height: 24px;
      margin: 0 0 16px;
      color: var(--muted);
      font-size: 13px;
    }

    .status-error { color: #b4233c; }

    .summary-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 14px;
    }

    .summary-card, .panel {
      border: 1px solid var(--line);
      background: rgba(255, 255, 255, .9);
      box-shadow: 0 18px 50px rgba(22, 62, 128, .07);
    }

    .summary-card {
      padding: 20px;
      border-radius: 17px;
    }

    .summary-label {
      margin: 0;
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
    }

    .summary-value {
      margin: 8px 0 0;
      font-size: 31px;
      font-weight: 820;
      letter-spacing: -.035em;
    }

    .summary-note {
      min-height: 18px;
      margin: 6px 0 0;
      color: var(--muted);
      font-size: 11px;
      line-height: 1.5;
    }

    .content-grid {
      display: grid;
      grid-template-columns: minmax(0, 1.25fr) minmax(320px, .75fr);
      gap: 16px;
      margin-top: 16px;
    }

    .panel {
      min-width: 0;
      padding: 22px;
      border-radius: 18px;
    }

    .panel-full { grid-column: 1 / -1; }

    .panel-header {
      display: flex;
      gap: 14px;
      align-items: baseline;
      justify-content: space-between;
      margin-bottom: 18px;
    }

    h2 {
      margin: 0;
      font-size: 17px;
      letter-spacing: -.015em;
    }

    .panel-hint {
      margin: 0;
      color: var(--muted);
      font-size: 11px;
    }

    .breakdown {
      display: grid;
      gap: 14px;
    }

    .bar-row {
      display: grid;
      grid-template-columns: minmax(160px, 1.3fr) minmax(120px, 1fr) 54px;
      gap: 12px;
      align-items: center;
    }

    .bar-label {
      overflow: hidden;
      font-size: 13px;
      font-weight: 650;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .bar-track {
      height: 9px;
      overflow: hidden;
      border-radius: 999px;
      background: #edf1f8;
    }

    .bar-fill {
      height: 100%;
      border-radius: inherit;
      background: linear-gradient(90deg, #255fdf, #45c9d8);
    }

    .bar-value {
      color: var(--muted);
      font-size: 12px;
      text-align: right;
    }

    .empty {
      padding: 34px 12px;
      color: var(--muted);
      font-size: 13px;
      text-align: center;
      border: 1px dashed var(--line);
      border-radius: 13px;
    }

    .table-wrap { overflow-x: auto; }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
    }

    th, td {
      padding: 11px 10px;
      text-align: left;
      border-bottom: 1px solid var(--line);
    }

    th {
      color: var(--muted);
      font-size: 11px;
      font-weight: 750;
    }

    td:last-child, th:last-child { text-align: right; }

    .privacy-note {
      display: flex;
      gap: 9px;
      align-items: flex-start;
      padding: 14px 16px;
      margin-top: 16px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.6;
      border: 1px solid rgba(22, 133, 101, .18);
      border-radius: 13px;
      background: rgba(22, 133, 101, .06);
    }

    .privacy-dot {
      flex: 0 0 auto;
      width: 8px;
      height: 8px;
      margin-top: 5px;
      border-radius: 50%;
      background: var(--success);
    }

    @media (max-width: 820px) {
      .header { align-items: flex-start; flex-direction: column; }
      .controls { justify-content: flex-start; }
      .summary-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .content-grid { grid-template-columns: 1fr; }
      .panel-full { grid-column: auto; }
    }

    @media (max-width: 540px) {
      .shell { width: min(100% - 24px, 1120px); padding-top: 34px; }
      .summary-grid { grid-template-columns: 1fr 1fr; gap: 9px; }
      .summary-card, .panel { padding: 16px; }
      .bar-row { grid-template-columns: minmax(120px, 1fr) 64px; }
      .bar-track { display: none; }
    }
  </style>
</head>
<body>
  <main class="shell">
    <header class="header">
      <div>
        <p class="eyebrow">OnlyTranslate · Internal</p>
        <h1>卸载反馈统计</h1>
        <p class="subtitle">匿名固定选项汇总。数据来自 Caddy 专用日志，不代表去重用户数。</p>
      </div>
      <div class="controls">
        <select id="period" class="control" aria-label="统计时间范围">
          <option value="7">最近 7 天</option>
          <option value="30" selected>最近 30 天</option>
          <option value="90">最近 90 天</option>
          <option value="all">全部保留数据</option>
        </select>
        <button id="export" class="button" type="button" disabled>导出 CSV</button>
        <button id="refresh" class="button button-primary" type="button">刷新数据</button>
      </div>
    </header>

    <p id="status" class="status" role="status">正在读取反馈日志…</p>

    <section class="summary-grid" aria-label="汇总数据">
      <article class="summary-card">
        <p class="summary-label">所选时段提交</p>
        <p id="period-total" class="summary-value">—</p>
        <p id="period-note" class="summary-note"></p>
      </article>
      <article class="summary-card">
        <p class="summary-label">最近 7 天</p>
        <p id="seven-total" class="summary-value">—</p>
        <p class="summary-note">按提交时间计算</p>
      </article>
      <article class="summary-card">
        <p class="summary-label">最近 30 天</p>
        <p id="thirty-total" class="summary-value">—</p>
        <p class="summary-note">包含有效固定选项</p>
      </article>
      <article class="summary-card">
        <p class="summary-label">最常见原因</p>
        <p id="top-reason" class="summary-value" style="font-size: 18px">—</p>
        <p id="top-reason-note" class="summary-note"></p>
      </article>
    </section>

    <section class="content-grid">
      <article class="panel">
        <div class="panel-header">
          <h2>主要卸载原因</h2>
          <p class="panel-hint">固定单选</p>
        </div>
        <div id="reasons" class="breakdown"></div>
      </article>

      <article class="panel">
        <div class="panel-header">
          <h2>首次使用障碍</h2>
          <p class="panel-hint">可选回答</p>
        </div>
        <div id="obstacles" class="breakdown"></div>
      </article>

      <article class="panel">
        <div class="panel-header">
          <h2>界面语言</h2>
        </div>
        <div id="locales" class="breakdown"></div>
      </article>

      <article class="panel">
        <div class="panel-header">
          <h2>扩展版本</h2>
        </div>
        <div id="versions" class="table-wrap"></div>
      </article>

      <article class="panel panel-full">
        <div class="panel-header">
          <h2>每日提交</h2>
          <p class="panel-hint">按浏览器本地日期显示</p>
        </div>
        <div id="daily" class="table-wrap"></div>
      </article>
    </section>

    <div class="privacy-note">
      <span class="privacy-dot" aria-hidden="true"></span>
      <span>专用日志只保留时间、问卷选项、扩展版本、界面语言和响应状态；Caddy 配置会删除 IP、请求头及其他请求元数据。日志按天滚动，最长保留 90 天。</span>
    </div>
  </main>

  <script>
    const reasonLabels = {
      no_longer_needed: '暂时不需要了',
      hard_to_start: '不知道如何开始使用',
      translation_quality: '翻译质量不理想',
      translation_speed: '翻译速度太慢',
      page_compatibility: '网页排版或兼容性问题',
      found_alternative: '找到了其他替代品',
      privacy_concerns: '权限或隐私顾虑',
      other: '其他原因',
    }

    const obstacleLabels = {
      none: '没有明显障碍',
      did_not_know_start: '不知道从哪里开始翻译',
      service_setup: '不会选择或配置翻译服务',
      translation_failed: '第一次翻译没有成功',
      unsupported_page: '想翻译的页面无法使用',
      controls_confusing: '功能入口或选项不好理解',
    }

    const localeLabels = {
      'zh-CN': '简体中文',
      'en-US': 'English',
      'zh-TW': '繁體中文',
      'ja-JP': '日本語',
    }

    const validThanksPaths = new Set([
      '/uninstall/thanks',
      '/en/uninstall/thanks',
      '/zh-tw/uninstall/thanks',
      '/ja/uninstall/thanks',
    ])

    const elements = {
      period: document.querySelector('#period'),
      refresh: document.querySelector('#refresh'),
      export: document.querySelector('#export'),
      status: document.querySelector('#status'),
      periodTotal: document.querySelector('#period-total'),
      periodNote: document.querySelector('#period-note'),
      sevenTotal: document.querySelector('#seven-total'),
      thirtyTotal: document.querySelector('#thirty-total'),
      topReason: document.querySelector('#top-reason'),
      topReasonNote: document.querySelector('#top-reason-note'),
      reasons: document.querySelector('#reasons'),
      obstacles: document.querySelector('#obstacles'),
      locales: document.querySelector('#locales'),
      versions: document.querySelector('#versions'),
      daily: document.querySelector('#daily'),
    }

    let records = []
    let visibleRecords = []

    function setStatus(message, isError = false) {
      elements.status.textContent = message
      elements.status.classList.toggle('status-error', isError)
    }

    function countBy(items, key) {
      const counts = new Map()
      for (const item of items) {
        const value = item[key]
        if (!value) continue
        counts.set(value, (counts.get(value) || 0) + 1)
      }
      return [...counts.entries()].sort((a, b) => b[1] - a[1] || String(a[0]).localeCompare(String(b[0])))
    }

    function createEmpty(message) {
      const empty = document.createElement('div')
      empty.className = 'empty'
      empty.textContent = message
      return empty
    }

    function renderBars(container, counts, labels, total) {
      if (!counts.length) {
        container.replaceChildren(createEmpty('所选时段暂无数据'))
        return
      }

      const max = counts[0][1]
      const rows = counts.map(([key, count]) => {
        const row = document.createElement('div')
        row.className = 'bar-row'

        const label = document.createElement('div')
        label.className = 'bar-label'
        label.textContent = labels[key] || key

        const track = document.createElement('div')
        track.className = 'bar-track'
        const fill = document.createElement('div')
        fill.className = 'bar-fill'
        fill.style.width = `${Math.max(4, count / max * 100)}%`
        track.append(fill)

        const value = document.createElement('div')
        value.className = 'bar-value'
        value.textContent = `${count} · ${total ? Math.round(count / total * 100) : 0}%`

        row.append(label, track, value)
        return row
      })

      container.replaceChildren(...rows)
    }

    function renderTable(container, headers, rows) {
      if (!rows.length) {
        container.replaceChildren(createEmpty('所选时段暂无数据'))
        return
      }

      const table = document.createElement('table')
      const head = document.createElement('thead')
      const headRow = document.createElement('tr')
      for (const headerText of headers) {
        const header = document.createElement('th')
        header.textContent = headerText
        headRow.append(header)
      }
      head.append(headRow)

      const body = document.createElement('tbody')
      for (const rowValues of rows) {
        const row = document.createElement('tr')
        for (const value of rowValues) {
          const cell = document.createElement('td')
          cell.textContent = String(value)
          row.append(cell)
        }
        body.append(row)
      }

      table.append(head, body)
      container.replaceChildren(table)
    }

    function dateKey(timestamp) {
      const date = new Date(timestamp)
      const year = date.getFullYear()
      const month = String(date.getMonth() + 1).padStart(2, '0')
      const day = String(date.getDate()).padStart(2, '0')
      return `${year}-${month}-${day}`
    }

    function recordsWithin(days) {
      if (days === 'all') return records.slice()
      const threshold = Date.now() - Number(days) * 24 * 60 * 60 * 1000
      return records.filter(record => record.timestamp >= threshold)
    }

    function render() {
      visibleRecords = recordsWithin(elements.period.value)
      const reasonCounts = countBy(visibleRecords, 'reason')
      const obstacleRecords = visibleRecords.filter(record => record.obstacle)
      const obstacleCounts = countBy(obstacleRecords, 'obstacle')
      const localeCounts = countBy(visibleRecords, 'locale')
      const versionCounts = countBy(visibleRecords, 'version')
      const dailyCounts = countBy(visibleRecords.map(record => ({ day: dateKey(record.timestamp) })), 'day')
        .sort((a, b) => String(b[0]).localeCompare(String(a[0])))

      elements.periodTotal.textContent = String(visibleRecords.length)
      elements.periodNote.textContent = elements.period.options[elements.period.selectedIndex].text
      elements.sevenTotal.textContent = String(recordsWithin('7').length)
      elements.thirtyTotal.textContent = String(recordsWithin('30').length)

      if (reasonCounts.length) {
        const [topKey, topCount] = reasonCounts[0]
        elements.topReason.textContent = reasonLabels[topKey] || topKey
        elements.topReasonNote.textContent = `${topCount} 次，占 ${Math.round(topCount / visibleRecords.length * 100)}%`
      } else {
        elements.topReason.textContent = '—'
        elements.topReasonNote.textContent = ''
      }

      renderBars(elements.reasons, reasonCounts, reasonLabels, visibleRecords.length)
      renderBars(elements.obstacles, obstacleCounts, obstacleLabels, obstacleRecords.length)
      renderBars(elements.locales, localeCounts, localeLabels, visibleRecords.length)
      renderTable(
        elements.versions,
        ['版本', '提交次数'],
        versionCounts.map(([version, count]) => [version, count]),
      )
      renderTable(
        elements.daily,
        ['日期', '提交次数'],
        dailyCounts.map(([day, count]) => [day, count]),
      )

      elements.export.disabled = visibleRecords.length === 0
    }

    function parseLogLine(line) {
      if (!line.trim()) return null

      try {
        const entry = JSON.parse(line)
        const timestamp = Number(entry.ts) * 1000
        const uri = entry.request && entry.request.uri
        if (!Number.isFinite(timestamp) || typeof uri !== 'string') return null

        const url = new URL(uri, window.location.origin)
        if (!validThanksPaths.has(url.pathname)) return null

        const reason = url.searchParams.get('reason') || ''
        const obstacle = url.searchParams.get('obstacle') || ''
        const version = url.searchParams.get('version') || '未知'
        const locale = url.searchParams.get('locale') || ''

        if (!(reason in reasonLabels)) return null
        if (obstacle && !(obstacle in obstacleLabels)) return null
        if (locale && !(locale in localeLabels)) return null
        if (version !== '未知' && !/^[0-9A-Za-z][0-9A-Za-z.+-]{0,31}$/.test(version)) return null

        return {
          timestamp,
          reason,
          obstacle,
          version,
          locale: locale || '未知',
        }
      } catch {
        return null
      }
    }

    async function loadRecords() {
      elements.refresh.disabled = true
      elements.export.disabled = true
      setStatus('正在读取反馈日志…')

      try {
        const dataDirectoryUrl = new URL('./data/', window.location.href)
        dataDirectoryUrl.username = ''
        dataDirectoryUrl.password = ''

        const listingResponse = await fetch(dataDirectoryUrl, {
          cache: 'no-store',
          headers: { Accept: 'application/json' },
        })
        if (!listingResponse.ok) throw new Error(`无法读取日志目录（HTTP ${listingResponse.status}）`)

        const listing = await listingResponse.json()
        const files = listing
          .filter(item => !item.is_dir)
          .map(item => item.name)
          .filter(name => name === 'submissions.json' || name.startsWith('submissions-'))
          .sort()

        const contents = await Promise.all(files.map(async name => {
          const fileUrl = new URL(encodeURIComponent(name), dataDirectoryUrl)
          const response = await fetch(fileUrl, { cache: 'no-store' })
          if (!response.ok) throw new Error(`无法读取 ${name}（HTTP ${response.status}）`)
          return response.text()
        }))

        records = contents
          .flatMap(content => content.split('\n'))
          .map(parseLogLine)
          .filter(Boolean)
          .sort((a, b) => b.timestamp - a.timestamp)

        render()
        setStatus(`已读取 ${files.length} 个日志文件，共 ${records.length} 条有效匿名反馈。更新时间：${new Date().toLocaleString()}`)
      } catch (error) {
        records = []
        render()
        setStatus(error instanceof Error ? error.message : '读取反馈日志失败', true)
      } finally {
        elements.refresh.disabled = false
      }
    }

    function csvCell(value) {
      return `"${String(value).replaceAll('"', '""')}"`
    }

    function exportCsv() {
      const rows = [
        ['提交时间', '主要原因', '首次使用障碍', '扩展版本', '界面语言'],
        ...visibleRecords.map(record => [
          new Date(record.timestamp).toISOString(),
          reasonLabels[record.reason],
          record.obstacle ? obstacleLabels[record.obstacle] : '',
          record.version,
          localeLabels[record.locale] || record.locale,
        ]),
      ]
      const csv = `\uFEFF${rows.map(row => row.map(csvCell).join(',')).join('\n')}`
      const url = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8' }))
      const link = document.createElement('a')
      link.href = url
      link.download = `onlytranslate-uninstall-feedback-${dateKey(Date.now())}.csv`
      link.click()
      URL.revokeObjectURL(url)
    }

    elements.period.addEventListener('change', render)
    elements.refresh.addEventListener('click', loadRecords)
    elements.export.addEventListener('click', exportCsv)
    loadRecords()
  </script>
</body>
</html>
